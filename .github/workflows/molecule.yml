---
name: Molecule CI/CD
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags-ignore:
      - "**"
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Ansible core and Ansible Lint
        run: pip3 install -r .github/workflows/requirements/requirements_ansible_lint.txt

      - name: Install Ansible core collection dependencies
        run: ansible-galaxy install -r .github/workflows/requirements/requirements_collections.yml

      - name: Run Ansible Lint
        run: ansible-lint --force-color

  molecule:
    name: Molecule
    runs-on: ubuntu-24.04
    needs: ansible-lint
    env:
      NGINX_CRT: ${{ secrets.NGINX_CRT }}
      NGINX_KEY: ${{ secrets.NGINX_KEY }}
      NGINX_JWT: ${{ secrets.NGINX_JWT }}
      RHEL_USERNAME: ${{ secrets.RHEL_USERNAME }}
      RHEL_PASSWORD: ${{ secrets.RHEL_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - waf-advanced
          - waf-amazon-rhel
          - waf-debian
          - default
          - waf-rocky-oracle
          - dos-alpine
          - dos-amazon-rhel
          - dos-debian
          - dos-default
          - waf-specific-version
          - waf-dos-uninstall
    steps:
      - name: Check out the codebase
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Validate required Molecule secrets
        run: |
          missing=0
          if [ -z "${NGINX_CRT}" ]; then
            echo "Missing required secret: NGINX_CRT"
            missing=1
          fi
          if [ -z "${NGINX_KEY}" ]; then
            echo "Missing required secret: NGINX_KEY"
            missing=1
          fi
          if [ -z "${NGINX_JWT}" ]; then
            echo "Missing required secret: NGINX_JWT"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Molecule tests are intentionally failing because required secrets are not available in this run context."
            exit 1
          fi

      - name: Install Ansible core and Molecule
        run: pip3 install -r .github/workflows/requirements/requirements_molecule.txt
        
      - name: Install Ansible core collection dependencies
        run: ansible-galaxy install -r .github/workflows/requirements/requirements_collections.yml


      - name: Run Molecule tests
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: 1
          ANSIBLE_FORCE_COLOR: 1

