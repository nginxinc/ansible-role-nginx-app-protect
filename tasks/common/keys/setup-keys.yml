---
- name: (Alpine Linux) Set up NGINX App Protect and security updates signing key
  when: ansible_facts['os_family'] == "Alpine"
  block:
    - name: (Alpine Linux) Set up NGINX App Protect WAF/DoS signing key URL
      ansible.builtin.set_fact:
        keysite: "{{ nginx_app_protect_signing_key['nginx_plus'] | default(nginx_app_protect_default_signing_key_rsa_pub) }}"

    - name: (Alpine Linux) Download NGINX App Protect WAF/DoS signing key
      ansible.builtin.get_url:
        url: "{{ keysite }}"
        dest: /etc/apk/keys/nginx_signing.rsa.pub
        mode: "0400"

    - name: (Alpine Linux) Set up NGINX App Protect WAF security updates signing key URL
      ansible.builtin.set_fact:
        keysite_security_updates: "{{ nginx_app_protect_signing_key['waf_security_updates'] | default(nginx_app_protect_waf_security_updates_default_signing_key_rsa_pub) }}"
      when: nginx_app_protect_waf_enable | bool

    - name: (Alpine Linux) Download NGINX App Protect WAF security updates signing key
      ansible.builtin.get_url:
        url: "{{ keysite_security_updates }}"
        dest: /etc/apk/keys/app-protect-security-updates.rsa.pub
        mode: "0400"
      when: nginx_app_protect_waf_enable | bool

- name: (Debian/Ubuntu) Set up NGINX App Protect and security updates signing key
  when: ansible_facts['os_family'] == "Debian"
  block:
    - name: (Debian/Ubuntu) Ensure APT keyring directory exists
      ansible.builtin.file:
        path: /usr/share/keyrings
        state: directory
        mode: "0755"

    - name: (Debian/Ubuntu) Download NGINX App Protect WAF/DoS signing key
      ansible.builtin.get_url:
        url: "{{ nginx_app_protect_signing_key['nginx_plus'] | default(nginx_app_protect_default_signing_key_pgp) }}"
        dest: /tmp/nginx-signing.key
        mode: "0644"

    - name: (Debian/Ubuntu) Create NGINX APT archive keyring
      ansible.builtin.command:
        cmd: gpg --batch --yes --dearmor --output /usr/share/keyrings/nginx-archive-keyring.gpg /tmp/nginx-signing.key
      changed_when: false
      # noqa command-instead-of-module - apt_key depends on apt-key which is removed on newer Debian releases

    - name: (Debian/Ubuntu) Download NGINX App Protect WAF security updates signing key
      ansible.builtin.get_url:
        url: "{{ nginx_app_protect_signing_key['waf_security_updates'] | default(nginx_app_protect_waf_security_updates_default_signing_key_pgp) }}"
        dest: /tmp/app-protect-security-updates.key
        mode: "0644"
      when: nginx_app_protect_waf_enable | bool

    - name: (Debian/Ubuntu) Import NGINX App Protect WAF security updates signing key into archive keyring
      ansible.builtin.command:
        cmd: gpg --batch --yes --no-default-keyring --keyring /usr/share/keyrings/nginx-archive-keyring.gpg --import /tmp/app-protect-security-updates.key
      changed_when: false
      # noqa command-instead-of-module - apt_key depends on apt-key which is removed on newer Debian releases
      when: nginx_app_protect_waf_enable | bool

- name: (Amazon Linux/RHEL) Set up NGINX App Protect and security updates signing key
  when: ansible_facts['os_family'] == "RedHat"
  block:
    - name: (Amazon Linux/RHEL <= 9) Add NGINX WAF/DoS signing key
      ansible.builtin.rpm_key:
        key: "{{ nginx_app_protect_signing_key['nginx_plus'] | default(nginx_app_protect_default_signing_key_pgp) }}"
      when: ansible_facts['distribution'] == "Amazon" or ansible_facts['distribution_major_version'] | int < 10

    - name: (RHEL 10+) Add NGINX WAF/DoS signing key
      ansible.builtin.command:
        cmd: rpm --import {{ nginx_app_protect_signing_key['nginx_plus'] | default(nginx_app_protect_default_signing_key_pgp) }}
      changed_when: false
      when:
        - ansible_facts['distribution'] != "Amazon"
        - ansible_facts['distribution_major_version'] | int >= 10
      # noqa command-instead-of-module - rpm_key fails on RHEL 10+ due to OpenPGP v6 key in RPM DB

    - name: (Amazon Linux/RHEL <= 9) Add NGINX App Protect WAF security updates signing key
      ansible.builtin.rpm_key:
        key: "{{ nginx_app_protect_signing_key['waf_security_updates'] | default(nginx_app_protect_waf_security_updates_default_signing_key_pgp) }}"
      when:
        - nginx_app_protect_waf_enable | bool
        - ansible_facts['distribution'] == "Amazon" or ansible_facts['distribution_major_version'] | int < 10

    - name: (RHEL 10+) Add NGINX App Protect WAF security updates signing key
      ansible.builtin.command:
        cmd: rpm --import {{ nginx_app_protect_signing_key['waf_security_updates'] | default(nginx_app_protect_waf_security_updates_default_signing_key_pgp) }}
      changed_when: false
      when:
        - nginx_app_protect_waf_enable | bool
        - ansible_facts['distribution'] != "Amazon"
        - ansible_facts['distribution_major_version'] | int >= 10
      # noqa command-instead-of-module - rpm_key fails on RHEL 10+ due to OpenPGP v6 key in RPM DB
