---
- name: (Amazon Linux/RHEL) {{ nginx_app_protect_license_status is defined | ternary('Remove', 'Configure') }} NGINX Plus repository
  ansible.builtin.yum_repository:
    name: nginx-plus
    description: NGINX Plus repository
    baseurl: "{{ nginx_plus_repository | default(lookup('vars', 'nginx_plus_default_repository_' + ((ansible_facts['distribution'] == 'Amazon') | ternary('amazon', 'redhat')))) }}"
    sslclientcert: /etc/ssl/nginx/nginx-repo.crt
    sslclientkey: /etc/ssl/nginx/nginx-repo.key
    enabled: true
    gpgcheck: true
    state: "{{ nginx_app_protect_license_status | default((nginx_app_protect_dos_setup == 'uninstall') | ternary('absent', 'present')) }}"
    mode: "0644"
  when: nginx_app_protect_dos_manage_repo | bool

- name: (Amazon Linux/RHEL) {{ nginx_app_protect_license_status is defined | ternary('Remove', 'Configure') }} NGINX App Protect DoS repository
  ansible.builtin.yum_repository:
    name: nginx-app-protect-dos
    description: NGINX App Protect DoS repository
    baseurl: "{{ nginx_app_protect_dos_repository | default(lookup('vars', 'nginx_app_protect_dos_default_repository_' + ((ansible_facts['distribution'] == 'Amazon') | ternary('amazon', 'redhat')))) }}"
    sslclientcert: /etc/ssl/nginx/nginx-repo.crt
    sslclientkey: /etc/ssl/nginx/nginx-repo.key
    enabled: true
    gpgcheck: true
    state: "{{ nginx_app_protect_license_status | default((nginx_app_protect_dos_setup == 'uninstall') | ternary('absent', 'present')) }}"
    mode: "0644"
  when: nginx_app_protect_dos_manage_repo | bool

- name: (Amazon Linux 2023) {{ nginx_app_protect_license_status is defined | ternary('Remove', 'Configure') }} NGINX App Protect DoS dependencies repository
  ansible.builtin.yum_repository:
    name: dependencies
    description: nap dependencies repo
    baseurl: https://pkgs.nginx.com/epel/2023/$basearch/
    sslclientcert: /etc/ssl/nginx/nginx-repo.crt
    sslclientkey: /etc/ssl/nginx/nginx-repo.key
    gpgcheck: false
    enabled: true
    state: "{{ nginx_app_protect_license_status | default((nginx_app_protect_dos_setup == 'uninstall') | ternary('absent', 'present')) }}"
    mode: "0644"
  when:
    - nginx_app_protect_dos_manage_repo | bool
    - ansible_facts['distribution'] == 'Amazon'
    - ansible_facts['distribution_major_version'] == '2023'

- name: (RHEL/Rocky Linux) {{ nginx_app_protect_license_status is defined | ternary('Remove', 'Configure') }} NGINX App Protect DoS dependencies repository
  ansible.builtin.yum_repository:
    name: dependencies
    description: nap dependencies repo
    baseurl: "https://pkgs.nginx.com/epel/{{ ansible_facts['distribution_major_version'] }}/$basearch/"
    sslclientcert: /etc/ssl/nginx/nginx-repo.crt
    sslclientkey: /etc/ssl/nginx/nginx-repo.key
    gpgcheck: false
    enabled: true
    state: "{{ nginx_app_protect_license_status | default((nginx_app_protect_dos_setup == 'uninstall') | ternary('absent', 'present')) }}"
    mode: "0644"
  when:
    - nginx_app_protect_dos_manage_repo | bool
    - ansible_facts['distribution'] != 'Amazon'

- name: (Amazon Linux/RHEL) Force Yum cache refresh
  ansible.builtin.command: yum clean metadata
  changed_when: false

- name: (Amazon Linux/RHEL) {{ nginx_app_protect_dos_setup | capitalize }} NGINX App Protect DoS
  ansible.builtin.yum:
    name: app-protect-dos{{ (nginx_app_protect_dos_state == 'absent') | ternary(',nginx-plus-module-appprotectdos', '') }}
    state: "{{ nginx_app_protect_dos_state }}"
    update_cache: true
  ignore_errors: "{{ ansible_check_mode }}"
  when: nginx_app_protect_license_status is not defined
  notify: (Handler - NGINX App Protect) Run NGINX
